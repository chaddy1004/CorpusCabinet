[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpus-cabinet"
version = "0.1.0"
description = "A native desktop academic reference manager"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "SQLAlchemy",
    "PyMuPDF",
    "requests",
    "beautifulsoup4",
    "PyYAML",
    "anthropic",
    "python-dotenv",
]

[project.scripts]
corpus-cabinet = "corpus_cabinet.desktop:run_app"

[project.optional-dependencies]
reader = [
    "docling>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_cabinet"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest",
]
